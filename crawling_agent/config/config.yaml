# Crawling Agent Configuration

# Data Source Connections
data_sources:
  erp:
    type: sql
    driver: sqlite  # or mysql, postgresql, etc.
    uri: ${ERP_DB_URI:sqlite:///synthetic_data_service/erp.db}
    timeout_seconds: 30
    max_connections: 5
    
  knowledge_graph:
    type: sparql
    endpoint: ${KG_ENDPOINT:http://localhost:3030/kg/sparql}
    timeout_seconds: 30
    auth:
      method: none  # or basic, token, etc.
      # username: ${KG_USERNAME}
      # password: ${KG_PASSWORD}
    
  document_storage:
    type: mongodb
    uri: ${DOCUMENT_DB_URI:mongodb://localhost:27017}
    database: ${DOCUMENT_DB_NAME:document_storage}
    timeout_seconds: 30
    max_connections: 5

# LLM Configuration
llm:
  provider: openai  # or azure, anthropic, etc.
  model: gpt-4
  api_key: ${LLM_API_KEY}
  temperature: 0.1
  max_tokens: 1000
  timeout_seconds: 60

# Crawling Settings
crawling:
  default_timeout_seconds: 60
  max_results_per_source: 1000
  retry_attempts: 3
  retry_delay_seconds: 2
  parallel_execution: true

# Logging Configuration
logging:
  level: ${LOG_LEVEL:INFO}
  log_to_file: ${LOG_TO_FILE:false}
  log_dir: ${LOG_DIR:logs}
  retention_days: 30