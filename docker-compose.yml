version: '3.8'

services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - SQL_HOST=erp
      - SQL_PORT=8001
    depends_on:
      - erp
    command: python -m crawling_agent.api.main --host 0.0.0.0 --port 8000
    networks:
      - mcp-network

  # ERP API service
  erp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./synthetic_data.db:/app/synthetic_data.db
    environment:
      - SQL_DB_PATH=/app/synthetic_data.db
    command: python -m crawling_agent.api.erp_api --host 0.0.0.0 --port 8001
    networks:
      - mcp-network

  # Web UI (using existing frontend)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app/frontend
    networks:
      - mcp-network
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000

networks:
  mcp-network:
    driver: bridge