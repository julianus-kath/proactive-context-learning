version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./synthetic_data.db:/home/node/synthetic_data.db
      - ./:/home/node/project  # Mount the entire project for access to Python scripts
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
      - WEBHOOK_URL=http://localhost:5678/
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_NODES_INCLUDE=n8n-nodes-sqlite3
    networks:
      - n8n-network
    restart: unless-stopped

  chatbot-ui:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./chatbot-interface:/usr/share/nginx/html
    networks:
      - n8n-network
    restart: unless-stopped

networks:
  n8n-network:
    driver: bridge