<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawling Agent Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h1>Corpy</h1>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message system">
                    <div class="message-content">
                        <p>Hey, its me, Corpy! Ask me anything about your data.</p>
                        <p>Example queries:</p>
                        <ul>
                            <li>"How many customers do we have?"</li>
                            <li>"Find all expensive products"</li>
                            <li>"Show me all employees in the sales department"</li>
                            <li>"List all completed orders"</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="user-input" placeholder="Type your query here..." />
                <button id="send-button" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
