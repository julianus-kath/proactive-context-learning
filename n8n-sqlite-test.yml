version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-sqlite-test
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-test-data:/home/node/.n8n
      - ./test.db:/home/node/test.db
      - ./synthetic_data.db:/home/node/synthetic_data.db
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - NODE_ENV=production
      - N8N_LOG_LEVEL=debug
    entrypoint: >
      /bin/sh -c "
        echo 'Installing SQLite node...' &&
        npm install -g n8n-nodes-sqlite3 &&
        echo 'Creating test database if it does not exist...' &&
        if [ ! -f /home/node/test.db ]; then
          echo 'CREATE TABLE test (id INTEGER PRIMARY KEY, name TEXT);
          INSERT INTO test (name) VALUES (\"Test 1\");
          INSERT INTO test (name) VALUES (\"Test 2\");' | sqlite3 /home/node/test.db;
        fi &&
        echo 'Starting n8n...' &&
        n8n start
      "
    restart: unless-stopped